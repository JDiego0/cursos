name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions sin hacer un commit.
  workflow_dispatch:

# Permisos que necesita la acción oficial de Pages para publicar.
permissions:
  contents: read
  pages: write
  id-token: write

# Si empujas dos veces seguidas, cancela el despliegue anterior en vez
# de encolarlo: sólo interesa que se publique el último commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # --base-href: el sitio cuelga de https://<usuario>.github.io/cursos/,
      # no de la raíz del dominio, así que los assets se piden desde /cursos/.
      - run: npx ng build --base-href /cursos/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/cursos-app/browser

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
